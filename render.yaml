services:
  - type: web
    name: stocksense
    runtime: python
    buildCommand: pip install -r requirements.txt && cd web && npm install && npm run build && cd ..
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
